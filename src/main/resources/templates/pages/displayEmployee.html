<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Employee Management | AutoHR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #2a5c8d;
            --secondary: #e63946;
            --accent: #457b9d;
            --light: #f1faee;
            --dark: #1d3557;
            --text: #2b2d42;
            --gray: #8d99ae;
            --radius: 8px;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --transition: all 0.25s ease;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            color: var(--text);
        }

        .admin-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
        }

        /* Admin Toolbar */
        .admin-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }

        .toolbar-left {
            flex: 1;
        }

        .nav-control {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: var(--radius);
            transition: var(--transition);
        }

        .nav-control:hover {
            background-color: rgba(42, 92, 141, 0.1);
            transform: translateX(-3px);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary);
            font-size: 2rem;
            margin: 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Search Form */
        .search-container {
            background: white;
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            font-size: 16px;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(69, 123, 157, 0.2);
        }

        .search-btn, .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .search-btn:hover, .add-btn:hover {
            background: var(--dark);
            transform: translateY(-2px);
        }

        .add-btn {
            background: var(--accent);
        }

        /* Table Styles */
        .table-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        .data-table thead {
            background: var(--primary);
            color: white;
        }

        .data-table th {
            padding: 16px 20px;
            text-align: left;
            font-weight: 600;
        }

        .data-table td {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .data-table tbody tr:last-child td {
            border-bottom: none;
        }

        .data-table tbody tr:hover {
            background-color: rgba(69, 123, 157, 0.05);
        }

        /* Status Badges */
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 500;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 15px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: none;
            text-decoration: none;
        }

        .edit-btn {
            background: var(--accent);
            color: white;
        }

        .edit-btn:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        .delete-btn {
            background: var(--secondary);
            color: white;
        }

        .delete-btn:hover {
            background: #c1121f;
            transform: translateY(-2px);
        }

        .view-btn {
            background: var(--dark);
            color: white;
        }

        .view-btn:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        /* No Data Message */
        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--gray);
            font-size: 16px;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: var(--radius);
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            color: var(--primary);
            margin: 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
        }

        .modal-body {
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .search-form {
                flex-direction: column;
            }

            .action-buttons {
                flex-direction: column;
            }

            .data-table {
                display: block;
                overflow-x: auto;
            }
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: var(--radius);
            font-weight: 500;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="admin-toolbar">
        <div class="toolbar-left">
            <a th:href="@{${#authorization.expression('hasRole(''ROLE_ADMIN'')') ? '/admin' : '/hrm'}}" class="nav-control">
                <i class="fas fa-chevron-left"></i>
                <span th:text="${#authorization.expression('hasRole(''ROLE_ADMIN'')') ? 'ADMIN Console' : 'HRM Console'}"></span>
            </a>
        </div>
    </div>
    <div id="statusMessage" class="alert" style="display: none;"></div>

    <div class="header">
        <h1><i class="fas fa-user-tie"></i> Employee Management</h1>
    </div>

    <!-- Search Form -->
    <div class="search-container">
        <form th:action="@{/displayEmployee}" method="get" class="search-form">
            <input type="text" name="search" class="search-input"
                   placeholder="Search by Name, Position, Department, Role, Qualification, or ID"
                   th:value="${param.search}">
            <button type="submit" class="search-btn">
                <i class="fas fa-search"></i> Search
            </button>
        </form>
    </div>

    <!-- Employee Table -->
    <div class="table-container">
        <table class="data-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Position</th>
                <th>Department</th>
                <th>Role</th>
                <th>Qualification</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${employees == null or #lists.isEmpty(employees)}">
                <td colspan="7" class="no-data">
                    <i class="fas fa-info-circle"></i>
                    <span th:text="${#strings.defaultString(errorMessage, 'No employees found')}"></span>
                </td>
            </tr>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.emp_id}"></td>
                <td><strong th:text="${emp.firstName + ' ' + emp.lastName}"></strong></td>
                <td th:text="${emp.position}"></td>
                <td th:text="${emp.department}"></td>
                <td th:text="${emp.role}"></td>
                <td th:text="${emp.qualification}"></td>
                <td>
                    <div class="action-buttons">
                        <a th:href="@{/editEmployee/{id}(id=${emp.emp_id})}" class="action-btn edit-btn">
                            <i class="fas fa-edit"></i> Edit
                        </a>
                        <button type="button"
                                class="action-btn delete-btn"
                                th:attr="data-emp-id=${emp.emp_id}, data-emp-name=${emp.firstName + ' ' + emp.lastName}"
                                onclick="showDeleteModal(this)">
                            <i class="fas fa-trash-alt"></i> Delete
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fas fa-exclamation-triangle"></i> Confirm Deletion</h3>
                <button type="button" class="close-modal" onclick="closeDeleteModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete employee: <strong id="userNameToDelete"></strong>?</p>
                <p class="text-muted">This action cannot be undone.</p>
                <input type="hidden" id="empIdToDelete" value="">
            </div>
            <div class="modal-footer">
                <button type="button" class="action-btn cancel-btn" onclick="closeDeleteModal()">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="button" class="action-btn delete-btn" onclick="confirmDelete()">
                    <i class="fas fa-trash-alt"></i> Delete
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function showDeleteModal(button) {
        const empId = button.getAttribute("data-emp-id");
        const empName = button.getAttribute("data-emp-name");

        document.getElementById("userNameToDelete").textContent = empName;
        document.getElementById("empIdToDelete").value = empId;
        document.getElementById("deleteModal").style.display = "flex";
    }

    function closeDeleteModal() {
        document.getElementById("deleteModal").style.display = "none";
    }

    function confirmDelete() {
        const empId = document.getElementById("empIdToDelete").value;
        const statusMessage = document.getElementById("statusMessage");

        fetch("/delete", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRF-TOKEN": document.querySelector('meta[name="csrf-token"]').content
            },
            body: `emp_id=${empId}`
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                closeDeleteModal();
                statusMessage.style.display = "block";
                statusMessage.className = `alert ${data.success ? 'alert-success' : 'alert-danger'}`;
                statusMessage.innerText = data.message;

                if (data.success) {
                    setTimeout(() => location.reload(), 1000);
                }
            })
            .catch(error => {
                console.error("Error:", error);
                statusMessage.style.display = "block";
                statusMessage.className = "alert alert-danger";
                statusMessage.innerText = "An error occurred while deleting the employee.";
            });
    }
</script>
</body>
</html>
