<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management | AutoHR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- CSS styles remain unchanged -->
  <style>
    /* Your CSS remains unchanged */
    :root {
        --primary: #2a5c8d;
        --secondary: #e63946;
        --accent: #457b9d;
        --light: #f1faee;
        --dark: #1d3557;
        --text: #2b2d42;
        --gray: #8d99ae;
        --radius: 8px;
        --shadow: 0 4px 12px rgba(0,0,0,0.08);
        --transition: all 0.25s ease;
    }

    body {
        font-family: 'Montserrat', sans-serif;
        background-color: #f8f9fa;
        margin: 0;
        color: var(--text);
    }

    .admin-container {
        max-width: 1400px;
        margin: 20px auto;
        padding: 20px;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    h1 {
        color: var(--primary);
        font-size: 2rem;
        margin: 0;
        font-weight: 700;
    }

    /* Search Form */
    .search-container {
        background: white;
        padding: 25px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 30px;
    }

    .search-form {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .search-input {
        flex: 1;
        padding: 12px 20px;
        border: 1px solid #ddd;
        border-radius: var(--radius);
        font-size: 16px;
        transition: var(--transition);
    }

    .search-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(69, 123, 157, 0.2);
    }

    .search-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: var(--radius);
        cursor: pointer;
        font-weight: 500;
        transition: var(--transition);
    }

    .search-btn:hover {
        background: var(--dark);
        transform: translateY(-2px);
    }

    .add-user-btn {
        background: var(--accent);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: var(--radius);
        cursor: pointer;
        font-weight: 500;
        transition: var(--transition);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .add-user-btn:hover {
        background: var(--primary);
        transform: translateY(-2px);
    }

    /* User Table */
    .table-container {
        background: white;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
    }

    .user-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
    }

    .user-table thead {
        background: var(--primary);
        color: white;
    }

    .user-table th {
        padding: 16px 20px;
        text-align: left;
        font-weight: 600;
    }

    .user-table td {
        padding: 14px 20px;
        border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .user-table tbody tr:last-child td {
        border-bottom: none;
    }

    .user-table tbody tr:hover {
        background-color: rgba(69, 123, 157, 0.05);
    }

    /* Status Badges */
    .status-badge {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 50px;
        font-size: 13px;
        font-weight: 500;
    }

    .status-active {
        background: #d4edda;
        color: #155724;
    }

    .status-inactive {
        background: #f8d7da;
        color: #721c24;
    }

    /* Action Buttons */
    .action-buttons {
        display: flex;
        gap: 10px;
    }

    .action-btn {
        padding: 8px 15px;
        border-radius: var(--radius);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: none;
    }

    .edit-btn {
        background: var(--accent);
        color: white;
        text-decoration: none;
    }

    .edit-btn:hover {
        background: var(--primary);
        transform: translateY(-2px);
    }

    .delete-btn {
        background: var(--secondary);
        color: white;
    }

    .delete-btn:hover {
        background: #c1121f;
        transform: translateY(-2px);
    }

    .view-btn {
        background: var(--dark);
        color: white;
        text-decoration: none;
    }

    .view-btn:hover {
        background: var(--primary);
        transform: translateY(-2px);
    }

    /* No Data Message */
    .no-data {
        text-align: center;
        padding: 40px;
        color: var(--gray);
        font-size: 16px;
    }

    /* Pagination */
    .pagination {
        display: flex;
        justify-content: center;
        padding: 20px;
        gap: 10px;
    }

    .page-btn {
        padding: 8px 15px;
        border-radius: var(--radius);
        background: white;
        border: 1px solid #ddd;
        cursor: pointer;
        transition: var(--transition);
    }

    .page-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
    }

    .page-btn:hover:not(.active) {
        background: #f1f1f1;
    }

    /* Modal Styles */
    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .modal-content {
        background-color: white;
        padding: 30px;
        border-radius: var(--radius);
        width: 90%;
        max-width: 500px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        animation: modalFadeIn 0.3s ease;
    }

    @keyframes modalFadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .modal-title {
        color: var(--primary);
        margin: 0;
        font-size: 1.5rem;
    }

    .close-modal {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--gray);
    }

    .modal-body {
        margin-bottom: 25px;
        line-height: 1.6;
    }

    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 15px;
    }

    .confirm-btn {
        background: var(--secondary);
        color: white;
    }

    .cancel-btn {
        background: var(--gray);
        color: white;
    }

    /* Alert Messages */
    .alert {
        padding: 15px 20px;
        margin-bottom: 20px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .alert-success {
        background-color: #d4edda;
        color: #155724;
        border-left: 4px solid #28a745;
    }

    .alert-danger {
        background-color: #f8d7da;
        color: #721c24;
        border-left: 4px solid #dc3545;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .search-form {
            flex-direction: column;
        }

        .action-buttons {
            flex-direction: column;
        }

        .user-table {
            display: block;
            overflow-x: auto;
        }
    }

    /* Professional Admin Toolbar */
    .admin-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 0;
        margin-bottom: 25px;
        border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .toolbar-left, .toolbar-right {
        flex: 1;
    }

    .toolbar-center {
        flex: 2;
        text-align: center;
    }

    .nav-control {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
        padding: 8px 15px;
        border-radius: var(--radius);
        transition: var(--transition);
    }

    .nav-control:hover {
        background-color: rgba(42, 92, 141, 0.1);
        transform: translateX(-3px);
    }

    .nav-control i {
        font-size: 0.9em;
    }

    .primary-action {
        background: var(--accent);
        color: white;
        padding: 10px 20px;
        border-radius: var(--radius);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
        transition: var(--transition);
        float: right;
    }

    .primary-action:hover {
        background: var(--primary);
        transform: translateY(-2px);
        box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
<div class="admin-container">
  <div class="admin-toolbar">
    <div class="toolbar-left">
      <a th:href="@{/admin}" class="nav-control">
        <i class="fas fa-chevron-left"></i> Admin Console
      </a>
    </div>
  </div>
  <div class="header">
    <h1><i class="fas fa-users-cog"></i> User Management</h1>
    <a th:href="@{/createUser}" class="add-user-btn">
      <i class="fas fa-user-plus"></i> Add New User
    </a>
  </div>

  <!-- Alert Messages -->
  <div th:if="${param.success}" class="alert alert-success">
    <i class="fas fa-check-circle"></i>
    <span th:text="${param.success}">Success message</span>
  </div>
  <div th:if="${param.error}" class="alert alert-danger">
    <i class="fas fa-exclamation-circle"></i>
    <span th:text="${param.error}">Error message</span>
  </div>

  <!-- Search Form -->
  <div class="search-container">
    <form th:action="@{/createUser/display}" method="get" class="search-form">
      <input type="text" name="search" class="search-input"
             placeholder="Search users by name, email, or username"
             th:value="${searchTerm}">
      <button type="submit" class="search-btn">
        <i class="fas fa-search"></i> Search
      </button>
    </form>
  </div>

  <!-- User Table -->
  <div class="table-container">
    <table class="user-table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Username</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <!-- Dynamic user data -->
      <tr th:each="user : ${users}" th:object="${user}">
        <td th:text="*{id}"></td>
        <td><strong th:text="*{firstName + ' ' + lastName}"></strong></td>
        <td th:text="*{email}"></td>
        <td th:text="*{username}"></td>
        <td>
          <div class="action-buttons">
            <a th:href="@{/editUser/{id}(id=${user.id})}" class="action-btn edit-btn">
              <i class="fas fa-edit"></i> Edit
            </a>
            <button type="button" class="action-btn delete-btn"
                    th:attr="data-user-id=*{id}, data-user-name=*{firstName + ' ' + lastName}"
                    onclick="showDeleteModal(this.getAttribute('data-user-id'), this.getAttribute('data-user-name'))">
              <i class="fas fa-trash-alt"></i> Delete
            </button>
          </div>
        </td>
      </tr>

      <!-- No users found message -->
      <tr th:if="${users == null || users.isEmpty()}">
        <td colspan="5" class="no-data">
          <i class="fas fa-info-circle"></i>
          <span th:text="${errorMessage != null} ? ${errorMessage} : 'No users found'"></span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title"><i class="fas fa-exclamation-triangle"></i> Confirm Deletion</h3>
        <button type="button" class="close-modal" onclick="closeDeleteModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete user: <strong id="userNameToDelete"></strong>?</p>
        <p class="text-muted">This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="action-btn cancel-btn" onclick="closeDeleteModal()">
          <i class="fas fa-times"></i> Cancel
        </button>
        <!-- Delete Form -->
        <form id="deleteForm" method="post" th:action="@{/createUser/delete/{id}(id=${userId})}">
          <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
          <input type="hidden" name="_method" value="delete" />
          <button type="submit" class="action-btn confirm-btn">
            <i class="fas fa-trash-alt"></i> Confirm Delete
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  function showDeleteModal(userId, userName) {
    document.getElementById("userNameToDelete").textContent = userName;
    document.getElementById("deleteForm").action = `/createUser/delete/${userId}`;
    document.getElementById("deleteModal").style.display = "flex";
  }

  function closeDeleteModal() {
    document.getElementById("deleteModal").style.display = "none";
  }

  window.onclick = function(event) {
    const modal = document.getElementById("deleteModal");
    if (event.target === modal) {
      closeDeleteModal();
    }
  }
</script>
</body>
</html>
