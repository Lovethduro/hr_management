<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee | AutoHR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2a5c8d;
            --secondary: #e63946;
            --accent: #457b9d;
            --light: #f1faee;
            --dark: #1d3557;
            --text: #2b2d42;
            --gray: #8d99ae;
            --radius: 8px;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --transition: all 0.25s ease;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            color: var(--text);
        }

        .admin-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }

        .admin-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }

        .toolbar-left {
            flex: 1;
        }

        .nav-control {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: var(--radius);
            transition: var(--transition);
        }

        .nav-control:hover {
            background-color: rgba(42, 92, 141, 0.1);
            transform: translateX(-3px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary);
            font-size: 2rem;
            margin: 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-col {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            font-size: 16px;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(69, 123, 157, 0.2);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.08);
        }

        .btn {
            padding: 12px 25px;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--gray);
            color: white;
        }

        .btn-secondary:hover {
            background: var(--text);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
<div class="admin-container">
    <div class="admin-toolbar">
        <div class="toolbar-left">
            <a href="/displayEmployee" class="nav-control">
                <i class="fas fa-chevron-left"></i>
                <span>Back to Employees</span>
            </a>
        </div>
    </div>

    <div class="header">
        <h1><i class="fas fa-user-edit"></i> Edit Employee</h1>
    </div>

    <!-- Form -->
    <form th:action="@{/updateEmployee}" th:object="${employee}" method="post" class="form-container">

        <input type="hidden" th:field="*{emp_id}" th:value="${employee.emp_id}" />

        <div class="form-row">
            <div class="form-col">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" th:field="*{firstName}" class="form-control" required />
                </div>
            </div>
            <div class="form-col">
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" th:field="*{lastName}" class="form-control" required />
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-col">
                <div class="form-group">
                    <label>Position</label>
                    <input type="text" th:field="*{position}" class="form-control" required />
                </div>
            </div>
            <div class="form-col">
                <div class="form-group">
                    <label>Department</label>
                    <select th:field="*{department}" class="form-control" required>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Operations">Operations</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-col">
                <div class="form-group">
                    <label>Role</label>
                    <select th:field="*{role}" class="form-control" required>
                        <option value="Developer">Developer</option>
                        <option value="Manager">Manager</option>
                        <option value="Analyst">Analyst</option>
                        <option value="Designer">Designer</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
            </div>
            <div class="form-col">
                <div class="form-group">
                    <label>Qualification</label>
                    <input type="text" th:field="*{qualification}" class="form-control" required />
                </div>
            </div>
        </div>

        <!-- New Form Fields -->
        <div class="form-group">
            <label>Postal Address</label>
            <input type="text" th:field="*{address}" class="form-control" required />
        </div>

        <div class="form-group">
            <label>Salary</label>
            <input type="number" th:field="*{salary}" class="form-control" required />
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control" required />
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="tel" th:field="*{phone}" class="form-control" required />
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="window.location.href='/displayEmployee'">
                <i class="fas fa-times"></i> Cancel
            </button>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Save Changes
            </button>
        </div>
    </form>
</div>
</body>
</html>
