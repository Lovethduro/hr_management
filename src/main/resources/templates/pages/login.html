<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" th:href="@{/css/style2.css}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #f0f0f0;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
            z-index: 1000;
        }

        .back-button:hover {
            background-color: #dcdcdc;
        }

        .error-message {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <button type="button" class="back-button" onclick="goBack();">
        <img th:src="@{/images/close.png}" alt="Back" width="20" height="20">
    </button>

    <form id="loginForm" th:action="@{/perform_login}" method="post" onsubmit="setRememberMeCookie();">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <h1>Login</h1>

        <div class="input-box">
            <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username">
            <i class='bx bxs-user'></i>
        </div>

        <div class="input-box">
            <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
            <i class='bx bxs-lock-alt' onclick="togglePassword()"></i>
        </div>

        <div class="remember-forgot">
            <label><input type="checkbox" id="rememberMe"> Remember me</label>
            <a th:href="@{/forgot-password}">Forgot password?</a>
        </div>

        <button type="submit" class="btn">Login</button>

        <!-- Error Message -->
        <div class="error-message" id="error-message" th:if="${param.error}">
            <span th:if="${param.error == 'missing_credentials'}">
                Please enter your username and password.
            </span>
            <span th:if="${param.error == 'invalid_credentials'}">
                Invalid username or password. Please try again.
            </span>
            <span th:unless="${param.error == 'missing_credentials' or param.error == 'invalid_credentials'}">
                Login failed. Please try again.
            </span>
        </div>

        <div class="register-link">
            <p>Don't have an account? <a th:href="@{/register}">Register</a></p>
        </div>
    </form>
</div>

<script th:src="@{/js/login.js}"></script>
<script>
    function setRememberMeCookie() {
        const username = document.getElementById("username").value;
        const rememberMe = document.getElementById("rememberMe").checked;

        if (rememberMe) {
            document.cookie = "username=" + username + "; path=/; max-age=" + (30 * 24 * 60 * 60);
        } else {
            document.cookie = "username=; path=/; max-age=0";
        }
    }

    function getCookie(name) {
        const cookies = document.cookie.split("; ");
        for (let cookie of cookies) {
            const [key, value] = cookie.split("=");
            if (key === name) return value;
        }
        return "";
    }

    window.onload = function() {
        const savedUsername = getCookie("username");
        if (savedUsername) {
            document.getElementById("username").value = savedUsername;
            document.getElementById("rememberMe").checked = true;
        }
    };

    function goBack() {
        window.history.back();
    }
</script>
</body>
</html>
